server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Encaminha tudo que comeca com /api para o backend, dentro da rede
    # interna do Docker (o nome "backend" e resolvido automaticamente
    # pelo Docker Compose - nao e um dominio real).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo o resto vai para o React (SPA) - o try_files garante que
    # rotas como /financeiro funcionem mesmo em um F5 direto na URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
